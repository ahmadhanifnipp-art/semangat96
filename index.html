<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Semangat MSIP 📚🔥</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 550px;

            padding: 45px 30px;

            text-align: center;

            background: white;

            border-radius: 30px;

            box-shadow:
                0 20px 50px rgba(0,0,0,0.25);

            animation: muncul 1.2s ease;
        }

        .emoji {
            font-size: 70px;

            animation: goyang 1.5s infinite;
        }

        h1 {
            margin-top: 20px;

            color: #6c4ab6;

            font-size: 30px;
        }

        p {
            margin-top: 20px;

            color: #444;

            font-size: 20px;

            line-height: 1.7;
        }

        .scopus {
            color: #e74c3c;

            font-size: 24px;

            font-weight: bold;
        }

        button {
            margin-top: 30px;

            padding: 16px 30px;

            border: none;

            border-radius: 30px;

            background: #6c4ab6;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        @keyframes muncul {

            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }

        }

        @keyframes goyang {

            0%, 100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <div class="emoji">
            📚🔥
        </div>

        <h1>
            SEMANGAT TEMAN-TEMAN MSIP! 💪🏻
        </h1>

        <p>

            Semangatt teman-teman MSIP<br>
            bikin jurnalnyaaa! 📝🔥

            <br><br>

            Bismillah...

            <br>

            <span class="scopus">
                TEMBUS SCOPUS SEMUAAA! 🚀🎓
            </span>

            <br><br>

            Jangan menyerahhh! 😭😂

        </p>


        <button onclick="pindahHalaman()">

            🔥 KLIK INI KALAU TEMAN-TEMAN SEMANGAT 🔥

        </button>

    </div>


    <script>

       function pindahHalaman() {
    window.location.href = "semangatmsip.html";
}
    </script>

</body>

</html>
