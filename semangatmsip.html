<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Wahhh Semangat! 🎉</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #8e54e9
                );

            overflow: hidden;

        }


        .card {

            width: 90%;

            max-width: 600px;

            padding: 50px 30px;

            text-align: center;

            background: rgba(255,255,255,0.95);

            border-radius: 35px;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.3);

            animation: muncul 1.5s ease;

        }


        .emoji {

            font-size: 80px;

            animation: loncat 1s infinite;

        }


        h1 {

            margin-top: 20px;

            color: #ff4f81;

            font-size: 38px;

        }


        p {

            margin-top: 25px;

            font-size: 22px;

            line-height: 1.7;

            color: #444;

        }


        .scopus {

            margin-top: 20px;

            font-size: 28px;

            font-weight: bold;

            color: #8e44ad;

        }


        .semangat {

            margin-top: 25px;

            font-size: 24px;

            font-weight: bold;

            color: #e67e22;

        }


        button {

            margin-top: 30px;

            padding: 14px 28px;

            border: none;

            border-radius: 30px;

            background: #ff4f81;

            color: white;

            font-size: 17px;

            cursor: pointer;

        }


        .floating {

            position: absolute;

            bottom: -50px;

            font-size: 30px;

            animation: terbang 6s linear forwards;

        }


        @keyframes muncul {

            from {

                opacity: 0;

                transform: scale(0.5);

            }

            to {

                opacity: 1;

                transform: scale(1);

            }

        }


        @keyframes loncat {

            0%, 100% {

                transform: translateY(0);

            }

            50% {

                transform: translateY(-15px);

            }

        }


        @keyframes terbang {

            0% {

                bottom: -50px;

                opacity: 0;

                transform: rotate(0deg);

            }

            20% {

                opacity: 1;

            }

            100% {

                bottom: 110%;

                opacity: 0;

                transform: rotate(360deg);

            }

        }

    </style>

</head>


<body>


    <div class="card">

        <div class="emoji">
            🎉📚🔥
        </div>


        <h1>
            WAHHH!!! 😭😂
        </h1>


        <p>

            Ternyata semangattt yaaa! 🤣🔥

            <br><br>

            Saya kira cuma klik-klik doang...

            <br>

            ternyata benar-benar
            <b>SEMANGAT!</b> 💪🏻

        </p>


        <div class="scopus">

            BISMILLAH TEMBUS SCOPUS SEMUAAA! 🚀🎓

        </div>


        <div class="semangat">

            📚 Jangan lupa jurnalnya dikerjakan yaaa! 😂

        </div>


        <button onclick="buatHujan()">

            🔥 SEMANGAT LAGI! 🔥

        </button>

    </div>



    <script>

        function buatHujan() {

            const emoji = [

                "🔥",
                "📚",
                "📝",
                "🎓",
                "🚀",
                "💪",
                "⭐",
                "🎉",
                "❤️"

            ];


            for (let i = 0; i < 50; i++) {

                let element =
                    document.createElement("div");


                element.classList.add("floating");


                element.innerHTML =
                    emoji[
                        Math.floor(
                            Math.random() *
                            emoji.length
                        )
                    ];


                element.style.left =
                    Math.random() * 100 + "vw";


                element.style.animationDelay =
                    Math.random() * 2 + "s";


                element.style.fontSize =
                    (Math.random() * 25 + 20)
                    + "px";


                document.body.appendChild(element);


                setTimeout(() => {

                    element.remove();

                }, 7000);

            }

        }


        // Otomatis membuat emoji berjatuhan
        buatHujan();

    </script>


</body>

</html>
